<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>კონტაქტის ფორმა</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .form-card {
      background: #ffffff;
      padding: 30px 40px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 400px;
    }
    .form-card h2 {
      margin-bottom: 20px;
      color: #333;
      text-align: center;
    }
    .input-group {
      margin-bottom: 15px;
    }
    .input-group label {
      display: block;
      margin-bottom: 5px;
      color: #666;
      font-size: 14px;
    }
    .input-group input,
    .input-group textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      outline: none;
      transition: 0.3s;
    }
    .input-group input:focus,
    .input-group textarea:focus {
      border-color: #764ba2;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #764ba2;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover {
      background: #5a3782;
    }
    #statusMsg {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="form-card">
    <h2>დაგვიკავშირდით</h2>
    <form id="contactForm">
      <div class="input-group">
        <label for="name">სახელი:</label>
        <input type="text" id="name" required>
      </div>
      <div class="input-group">
        <label for="email">ელ-ფოსტა:</label>
        <input type="email" id="email" required>
      </div>
      <div class="input-group">
        <label for="message">შეტყობინება:</label>
        <textarea id="message" rows="4" required></textarea>
      </div>
      <button type="submit">გაგზავნა</button>
    </form>
    <div id="statusMsg"></div>
  </div>

  <script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbz2JY_tYeh8sSHrvVteJceiz6aUaDWQN1hepvVD47QUs4v0La9RX2KvS7h1pru6HBVN/exec';
    const form = document.getElementById('contactForm');
    const statusMsg = document.getElementById('statusMsg');

    form.addEventListener('submit', e => {
      e.preventDefault();
      statusMsg.style.color = 'blue';
      statusMsg.textContent = 'იგზავნება...';

      const data = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        message: document.getElementById('message').value
      };

      fetch(scriptURL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      })
      .then(() => {
        statusMsg.style.color = 'green';
        statusMsg.textContent = 'მონაცემები წარმატებით გაიგზავნა!';
        form.reset();
      })
      .catch(error => {
        statusMsg.style.color = 'red';
        statusMsg.textContent = 'შეცდომა! სცადეთ თავიდან.';
        console.error('Error!', error.message);
      });
    });
  </script>

</body>
</html>
